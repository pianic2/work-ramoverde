[project]
name = "ramoverde-backend"
version = "0.1.0"
description = "RamoVerde Django API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "django-cors-headers>=4.9,<5",
  "drf-spectacular>=0.28,<0.29",
  "djangorestframework-simplejwt>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
  "dj-database-url>=2.3,<3",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "pyotp>=2.9,<3",
  "webauthn>=2.5,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6.3,<7",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
  "django-stubs[compatible-mypy]>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4",
]

[project.optional-dependencies]
storage = ["django-storages[s3]>=1.14,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "--strict-markers --strict-config --cov=apps --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"config/settings/production.py" = ["S105"]
"tests/*.py" = ["S105", "S106"]
"../../scripts/doctor.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
