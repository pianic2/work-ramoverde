name: Bug report
description: Report a reproducible problem in RamoVerde
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and actual behavior.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Relevant versions and commands
    validations: { required: true }
