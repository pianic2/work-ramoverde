name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so live advisory databases (security job) are rechecked without code changes.
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: example.com
      DJANGO_CORS_ALLOWED_ORIGINS: https://example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with: { enable-cache: true, python-version: "3.13" }
      - run: cd apps/backend && uv sync --locked --all-groups
      - run: cd apps/backend && uv run ruff check . ../../scripts && uv run ruff format --check . ../../scripts
      - run: cd apps/backend && uv run mypy config apps
      - run: cd apps/backend && uv run pytest
      - run: cd apps/backend && uv run python manage.py makemigrations --check --dry-run
      - run: cd apps/backend && uv run python manage.py check --deploy --settings=config.settings.production

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # Do not request setup-node's pnpm cache before Corepack has made pnpm available.
        with: { node-version: "24" }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec eslint apps packages
      - run: corepack pnpm --filter @ramoverde/api-client typecheck
      - run: corepack pnpm --filter @ramoverde/web typecheck
      - run: corepack pnpm --filter @ramoverde/shared typecheck
      - run: corepack pnpm --filter @ramoverde/web exec vitest run
      - run: corepack pnpm --filter @ramoverde/web build
      - run: corepack pnpm --filter @ramoverde/web exec playwright install --with-deps chromium
      - run: corepack pnpm --filter @ramoverde/web test:e2e
      - run: corepack pnpm --filter @ramoverde/mobile typecheck
      - run: corepack pnpm --filter @ramoverde/mobile test
      - run: EXPO_PUBLIC_API_URL=https://api.example.com/api/v1 corepack pnpm --filter @ramoverde/mobile exec expo export --platform android

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with: { enable-cache: true, python-version: "3.13" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - run: corepack enable
      - run: cd apps/backend && uv sync --locked --all-groups
      - run: corepack pnpm install --frozen-lockfile
      - run: make api-check

  # Checks against live registries (vulnerability advisories, Expo SDK patch expectations)
  # change independently of the code: keep them in their own job so a new advisory or
  # Expo patch release is clearly attributed instead of masking deterministic gates.
  live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with: { enable-cache: true, python-version: "3.13" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - run: corepack enable
      - run: cd apps/backend && uv audit --locked
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm audit --prod --audit-level high
      - run: corepack pnpm --filter @ramoverde/mobile exec expo-doctor

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with: { enable-cache: true, python-version: "3.13" }
      - run: cd apps/backend && uv sync --locked --all-groups
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: make smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: DATABASE_URL=postgresql://app:ci-only@localhost:5432/app DJANGO_SECRET_KEY=ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret DJANGO_ALLOWED_HOSTS=example.com DJANGO_CORS_ALLOWED_ORIGINS=https://example.com DJANGO_CSRF_TRUSTED_ORIGINS=https://example.com VITE_API_BASE_URL=https://api.example.com/api/v1 docker compose -f compose.production.yaml config --quiet
      - run: make docker-build
      - run: bash scripts/docker-production-smoke.sh
