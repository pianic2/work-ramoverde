      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPage'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
    delete:
      operationId: deleteCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/section-schemas:
    get:
      operationId: listCmsSectionSchemas
      description: Catalogue of section types, versions, variants and content fields
        (for editor UIs).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionSchema'
          description: ''
  /api/v1/cms/seo-settings:
    get:
      operationId: getCmsSeoSettings
      description: GET / PATCH of a singleton settings row (staff + view/change model
        permission).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOSettings'
          description: ''
    patch:
      operationId: updateCmsSeoSettings
      description: GET / PATCH of a singleton settings row (staff + view/change model
        permission).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSEOSettings'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOSettings'
          description: ''
  /api/v1/cms/site-settings:
    get:
      operationId: getCmsSiteSettings
      description: GET / PATCH of a singleton settings row (staff + view/change model
        permission).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
    patch:
      operationId: updateCmsSiteSettings
      description: GET / PATCH of a singleton settings row (staff + view/change model
        permission).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteSettings'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/media/assets:
    get:
      operationId: listMediaAssets
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssetList'
          description: ''
    post:
      operationId: createMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaAssetUpload'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
  /api/v1/media/assets/{id}:
    get:
      operationId: getMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
    patch:
      operationId: updateMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMediaAssetUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
    delete:
      operationId: deleteMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/media/assets/{id}/download:
    get:
      operationId: downloadMediaAsset
      description: Download the blob as an attachment. Non-public blobs need the download
        permission.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '302':
          description: Redirect to a short-lived signed URL (S3/R2).
  /api/v1/public/media-assets:
    get:
      operationId: listPublicMediaAssets
      description: 'Anonymous listing: only PUBLIC + APPROVED assets.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicMediaAssetList'
          description: ''
  /api/v1/public/navigation/{key}:
    get:
      operationId: getPublicNavigation
      description: Visible items of a menu whose targets are published pages or safe
        URLs.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNavigation'
          description: ''
  /api/v1/public/pages/{slug}:
    get:
      operationId: getPublicPage
      description: Published page by slug with its enabled sections. Drafts and archived
        pages are 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
          description: ''
  /api/v1/public/site-settings:
    get:
      operationId: getPublicSiteSettings
      description: Public company data and SEO defaults. Unconfirmed values are null.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteSettings'
          description: ''
  /api/v1/users/me:
    get:
      operationId: getUsersMe
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    AuthorizationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
