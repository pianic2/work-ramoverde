openapi: 3.0.3
info:
  title: RamoVerde API
  version: 1.0.0
  description: Versioned REST contract shared by the RamoVerde web and mobile clients.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/mfa:
    get:
      operationId: getAuthMfa
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
  /api/v1/auth/mfa/recovery-codes:
    post:
      operationId: postAuthMfaRecoveryCodes
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/mfa/totp:
    delete:
      operationId: deleteAuthMfaTotp
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: postAuthMfaTotpConfirm
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
  /api/v1/auth/mfa/totp/setup:
    post:
      operationId: postAuthMfaTotpSetup
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/auth/mfa/webauthn/{id}:
    delete:
      operationId: deleteAuthMfaWebauthn
      description: Changing second factors requires a recent MFA verification (step-up).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/webauthn/register/options:
    post:
      operationId: postAuthMfaWebauthnRegisterOptions
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/v1/auth/mfa/webauthn/register/verify:
    post:
      operationId: postAuthMfaWebauthnRegisterVerify
      description: Changing second factors requires a recent MFA verification (step-up).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
  /api/v1/auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
          description: 'Mobile: new token pair.'
        '204':
          description: 'Web: session kept, other sessions revoked.'
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: postAuthPasswordResetConfirm
      description: 'Sets the new password. Does not sign in: MFA is required at next
        sign-in.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/session/login:
    post:
      operationId: postAuthSessionLogin
      description: 'Password step. Does not sign in: a second factor must follow.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthFlow'
          description: ''
  /api/v1/auth/session/logout:
    post:
      operationId: postAuthSessionLogout
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/session/mfa/totp/confirm:
    post:
      operationId: postAuthSessionMfaTotpConfirm
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthFlow'
          description: ''
  /api/v1/auth/session/mfa/totp/setup:
    post:
      operationId: postAuthSessionMfaTotpSetup
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/auth/session/mfa/verify:
    post:
      operationId: postAuthSessionMfaVerify
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthFlow'
          description: ''
  /api/v1/auth/session/mfa/webauthn/options:
    post:
      operationId: postAuthSessionMfaWebauthnOptions
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/v1/auth/session/mfa/webauthn/register/options:
    post:
      operationId: postAuthSessionMfaWebauthnRegisterOptions
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/v1/auth/session/mfa/webauthn/register/verify:
    post:
      operationId: postAuthSessionMfaWebauthnRegisterVerify
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnRegister'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthFlow'
          description: ''
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: deleteAuthSession
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/revoke-all:
    post:
      operationId: postAuthSessionsRevokeAll
      description: 'Global logout: every web session and every mobile refresh token,
        this one included.'
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: postAuthSessionsRevokeOthers
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/step-up:
    post:
      operationId: postAuthStepUp
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaVerify'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
          description: ''
  /api/v1/auth/step-up/webauthn/options:
    post:
      operationId: postAuthStepUpWebauthnOptions
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: postAuthToken
      description: 'Password step. Never returns tokens: complete it with a second
        factor.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthFlow'
          description: ''
  /api/v1/auth/token/logout:
    post:
      operationId: postAuthTokenLogout
      description: Unauthenticated auth endpoint that reports failures as 401 with
        a generic message.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileLogout'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/token/mfa/totp/confirm:
    post:
      operationId: postAuthTokenMfaTotpConfirm
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTotpConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileTotpConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileTotpConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/auth/token/mfa/totp/setup:
    post:
      operationId: postAuthTokenMfaTotpSetup
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileChallenge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileChallenge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileChallenge'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/auth/token/mfa/verify:
    post:
      operationId: postAuthTokenMfaVerify
      description: Unauthenticated step of the sign-in flow; failures are generic
        401s.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileMfaVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileMfaVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileMfaVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: postAuthTokenRefresh
      description: Unauthenticated auth endpoint that reports failures as 401 with
        a generic message.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/cms/navigation-menus:
    get:
      operationId: listCmsNavigationMenus
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNavigationMenuList'
          description: ''
    post:
      operationId: createCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationMenu'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
  /api/v1/cms/navigation-menus/{menu_pk}/items:
    get:
      operationId: listCmsNavigationItems
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavigationItem'
          description: ''
    post:
      operationId: createCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationItem'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
  /api/v1/cms/navigation-menus/{menu_pk}/items/{id}:
    get:
      operationId: getCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
    patch:
      operationId: updateCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNavigationItem'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
    delete:
      operationId: deleteCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/navigation-menus/{id}:
    get:
      operationId: getCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
    patch:
      operationId: updateCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNavigationMenu'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
    delete:
      operationId: deleteCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/pages:
    get:
      operationId: listCmsPages
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageList'
          description: ''
    post:
      operationId: createCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
  /api/v1/cms/pages/{page_pk}/sections:
    get:
      operationId: listCmsPageSections
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
