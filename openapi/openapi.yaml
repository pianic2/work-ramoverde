openapi: 3.0.3
info:
  title: RamoVerde API
  version: 1.0.0
  description: Versioned REST contract shared by the RamoVerde web and mobile clients.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/session/login:
    post:
      operationId: postAuthSessionLogin
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/session/logout:
    post:
      operationId: postAuthSessionLogout
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/token:
    post:
      operationId: postAuthToken
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/auth/token/logout:
    post:
      operationId: postAuthTokenLogout
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileLogout'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh:
    post:
      operationId: postAuthTokenRefresh
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/cms/pages:
    get:
      operationId: listCmsPages
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageList'
          description: ''
    post:
      operationId: createCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
  /api/v1/cms/pages/{page_pk}/sections:
    get:
      operationId: listCmsPageSections
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageSection'
          description: ''
    post:
      operationId: createCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageSection'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
  /api/v1/cms/pages/{page_pk}/sections/{id}:
    get:
      operationId: getCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
    patch:
      operationId: updateCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPageSection'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
    delete:
      operationId: deleteCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/pages/{page_pk}/sections/order:
    put:
      operationId: reorderCmsPageSections
      description: '`section_ids` must list every section of the page exactly once.'
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionOrder'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageSection'
          description: ''
  /api/v1/cms/pages/{id}:
    get:
      operationId: getCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
    patch:
      operationId: updateCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPage'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
    delete:
      operationId: deleteCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/section-schemas:
    get:
      operationId: listCmsSectionSchemas
      description: Catalogue of section types, versions, variants and content fields
        (for editor UIs).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionSchema'
          description: ''
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/media/assets:
    get:
      operationId: listMediaAssets
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssetList'
          description: ''
    post:
      operationId: createMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaAssetUpload'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
  /api/v1/media/assets/{id}:
    get:
      operationId: getMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
    patch:
      operationId: updateMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMediaAssetUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
    delete:
      operationId: deleteMediaAsset
      description: Staff media library. Requires staff + `media.<action>_mediaasset`
        permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/media/assets/{id}/download:
    get:
      operationId: downloadMediaAsset
      description: Download the blob as an attachment. Non-public blobs need the download
        permission.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this media asset.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '302':
          description: Redirect to a short-lived signed URL (S3/R2).
  /api/v1/public/media-assets:
    get:
      operationId: listPublicMediaAssets
      description: 'Anonymous listing: only PUBLIC + APPROVED assets.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicMediaAssetList'
          description: ''
  /api/v1/public/pages/{slug}:
    get:
      operationId: getPublicPage
      description: Published page by slug with its enabled sections. Drafts and archived
        pages are 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
          description: ''
  /api/v1/users/me:
    get:
      operationId: getUsersMe
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    AuthorizationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending review
        * `APPROVED` - Approved for publication
        * `REJECTED` - Rejected
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    MediaAsset:
      type: object
      description: 'Staff representation: full metadata, never the blob itself.'
      properties:
        id:
          type: integer
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        kind:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        checksum_sha256:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        alt_text:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        origin:
          $ref: '#/components/schemas/OriginEnum'
        source_note:
          type: string
          description: Author, licence or provenance of the file.
          maxLength: 255
        authorization_status:
          allOf:
          - $ref: '#/components/schemas/AuthorizationStatusEnum'
          readOnly: true
          description: |-
            Public site usage requires APPROVED (photo publication rules are DA DEFINIRE).

            * `PENDING` - Pending review
            * `APPROVED` - Approved for publication
            * `REJECTED` - Rejected
        public_url:
          type: string
          nullable: true
          readOnly: true
        uploaded_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - authorization_status
      - checksum_sha256
      - created_at
      - height
      - id
      - kind
      - mime_type
      - original_filename
      - public_url
      - size
      - updated_at
      - uploaded_by_email
      - width
    MediaAssetUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
        alt_text:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 500
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: PRIVATE
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          default: STAFF_UPLOAD
        source_note:
          type: string
          maxLength: 255
      required:
      - file
    MobileCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MobileLogout:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    MobileRefresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MobileTokenResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    OriginEnum:
      enum:
      - STAFF_UPLOAD
      - CLIENT_PROVIDED
      - THIRD_PARTY
      type: string
      description: |-
        * `STAFF_UPLOAD` - Uploaded by staff
        * `CLIENT_PROVIDED` - Provided by the client
        * `THIRD_PARTY` - Third party / licensed
    Page:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/StatusEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        seo_title:
          type: string
          maxLength: 70
        seo_description:
          type: string
          maxLength: 300
        og_image:
          type: integer
          nullable: true
        canonical_url:
          type: string
          maxLength: 500
        noindex:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - published_at
      - slug
      - title
      - updated_at
    PageSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        variant:
          type: string
          maxLength: 40
        position:
          type: integer
          readOnly: true
        enabled:
          type: boolean
        schema_version:
          type: integer
          minimum: 1
          description: Defaults to the latest version of the type.
        content:
          description: Section content; shape defined by the (type, schema_version)
            schema.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - position
      - type
      - updated_at
      - variant
    PaginatedMediaAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    PaginatedPageList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    PaginatedPublicMediaAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicMediaAsset'
    PatchedMediaAssetUpdate:
      type: object
      properties:
        alt_text:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        origin:
          $ref: '#/components/schemas/OriginEnum'
        source_note:
          type: string
          description: Author, licence or provenance of the file.
          maxLength: 255
        authorization_status:
          allOf:
          - $ref: '#/components/schemas/AuthorizationStatusEnum'
          description: |-
            Public site usage requires APPROVED (photo publication rules are DA DEFINIRE).

            * `PENDING` - Pending review
            * `APPROVED` - Approved for publication
            * `REJECTED` - Rejected
    PatchedPage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/StatusEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        seo_title:
          type: string
          maxLength: 70
        seo_description:
          type: string
          maxLength: 300
        og_image:
          type: integer
          nullable: true
        canonical_url:
          type: string
          maxLength: 500
        noindex:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPageSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        variant:
          type: string
          maxLength: 40
        position:
          type: integer
          readOnly: true
        enabled:
          type: boolean
        schema_version:
          type: integer
          minimum: 1
          description: Defaults to the latest version of the type.
        content:
          description: Section content; shape defined by the (type, schema_version)
            schema.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PublicMedia:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        mime_type:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        alt_text:
          type: string
      required:
      - alt_text
      - height
      - id
      - mime_type
      - url
      - width
    PublicMediaAsset:
      type: object
      description: Anonymous representation of a PUBLIC + APPROVED asset.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        alt_text:
          type: string
          readOnly: true
        caption:
          type: string
          readOnly: true
      required:
      - alt_text
      - caption
      - height
      - id
      - mime_type
      - url
      - width
    PublicPage:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
        published_at:
          type: string
          format: date-time
        seo:
          allOf:
          - $ref: '#/components/schemas/PublicSeo'
          readOnly: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PublicSection'
          readOnly: true
      required:
      - published_at
      - sections
      - seo
      - slug
      - title
    PublicSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        variant:
          type: string
        schema_version:
          type: integer
        content:
          type: object
          additionalProperties: {}
          description: Validated content; media ids are replaced by public media objects
            (or null).
      required:
      - content
      - id
      - schema_version
      - type
      - variant
    PublicSeo:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        canonical_url:
          type: string
          nullable: true
        noindex:
          type: boolean
        og_image:
          allOf:
          - $ref: '#/components/schemas/PublicMedia'
          nullable: true
      required:
      - canonical_url
      - description
      - noindex
      - og_image
      - title
    SectionOrder:
      type: object
      properties:
        section_ids:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - section_ids
    SectionSchema:
      type: object
      properties:
        type:
          type: string
        schema_version:
          type: integer
        latest:
          type: boolean
        variants:
          type: array
          items:
            type: string
        content_fields:
          type: object
          additionalProperties: {}
          description: Content field name -> field description.
      required:
      - content_fields
      - latest
      - schema_version
      - type
      - variants
    SessionLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StatusEnum:
      enum:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    TypeEnum:
      enum:
      - hero
      - services
      - projects
      - gallery
      - text-media
      - stats
      - certifications
      - cta
      - contact
      - territory
      type: string
      description: |-
        * `hero` - Hero
        * `services` - Services
        * `projects` - Projects
        * `gallery` - Gallery
        * `text-media` - Text + media
        * `stats` - Stats
        * `certifications` - Certifications
        * `cta` - Call to action
        * `contact` - Contact
        * `territory` - Territory
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Nome
        last_name:
          type: string
          readOnly: true
          title: Cognome
      required:
      - email
      - first_name
      - id
      - last_name
    VisibilityEnum:
      enum:
      - PUBLIC
      - PRIVATE
      type: string
      description: |-
        * `PUBLIC` - Public
        * `PRIVATE` - Private
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:8010
