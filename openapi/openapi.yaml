openapi: 3.0.3
info:
  title: RamoVerde API
  version: 1.0.0
  description: Versioned REST contract shared by the RamoVerde web and mobile clients.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/session/login:
    post:
      operationId: postAuthSessionLogin
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/session/logout:
    post:
      operationId: postAuthSessionLogout
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/token:
    post:
      operationId: postAuthToken
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileCredentials'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/auth/token/logout:
    post:
      operationId: postAuthTokenLogout
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileLogout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileLogout'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh:
    post:
      operationId: postAuthTokenRefresh
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
          description: ''
  /api/v1/cms/navigation-menus:
    get:
      operationId: listCmsNavigationMenus
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNavigationMenuList'
          description: ''
    post:
      operationId: createCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationMenu'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
  /api/v1/cms/navigation-menus/{menu_pk}/items:
    get:
      operationId: listCmsNavigationItems
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavigationItem'
          description: ''
    post:
      operationId: createCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationItem'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
  /api/v1/cms/navigation-menus/{menu_pk}/items/{id}:
    get:
      operationId: getCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
    patch:
      operationId: updateCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNavigationItem'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationItem'
          description: ''
    delete:
      operationId: deleteCmsNavigationItem
      description: Items of one menu, ordered by `position`; `parent` allows one level
        of nesting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation item.
        required: true
      - in: path
        name: menu_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/navigation-menus/{id}:
    get:
      operationId: getCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
    patch:
      operationId: updateCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNavigationMenu'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
          description: ''
    delete:
      operationId: deleteCmsNavigationMenu
      description: Navigation menus (header, footer...) with their items.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this navigation menu.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/pages:
    get:
      operationId: listCmsPages
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageList'
          description: ''
    post:
      operationId: createCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
  /api/v1/cms/pages/{page_pk}/sections:
    get:
      operationId: listCmsPageSections
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageSection'
          description: ''
    post:
      operationId: createCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageSection'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
  /api/v1/cms/pages/{page_pk}/sections/{id}:
    get:
      operationId: getCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
    patch:
      operationId: updateCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPageSection'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSection'
          description: ''
    delete:
      operationId: deleteCmsPageSection
      description: Ordered sections of one page. New sections are appended; use `order`
        to reorder.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page section.
        required: true
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cms/pages/{page_pk}/sections/order:
    put:
      operationId: reorderCmsPageSections
      description: '`section_ids` must list every section of the page exactly once.'
      parameters:
      - in: path
        name: page_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionOrder'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageSection'
          description: ''
  /api/v1/cms/pages/{id}:
    get:
      operationId: getCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
    patch:
      operationId: updateCmsPage
      description: Staff page management. Drafts are visible here; changing `status`
        needs publish rights.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this page.
        required: true
      tags:
