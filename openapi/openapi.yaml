components:
  schemas:
    AuthFlowStatusEnum:
      enum:
      - mfa_required
      - mfa_enrollment_required
      - authenticated
      type: string
      description: |-
        * `mfa_required` - Second factor required
        * `mfa_enrollment_required` - Second factor enrollment required
        * `authenticated` - Authenticated
    AuthorizationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending review
        * `APPROVED` - Approved for publication
        * `REJECTED` - Rejected
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    KindEnum:
      enum:
      - web
      - mobile
      type: string
      description: |-
        * `web` - Web
        * `mobile` - Mobile
    MediaAsset:
      type: object
      description: 'Staff representation: full metadata, never the blob itself.'
      properties:
        id:
          type: integer
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        kind:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        checksum_sha256:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        alt_text:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        origin:
          $ref: '#/components/schemas/OriginEnum'
        source_note:
          type: string
          description: Author, licence or provenance of the file.
          maxLength: 255
        authorization_status:
          allOf:
          - $ref: '#/components/schemas/AuthorizationStatusEnum'
          readOnly: true
          description: |-
            Public site usage requires APPROVED (photo publication rules are DA DEFINIRE).

            * `PENDING` - Pending review
            * `APPROVED` - Approved for publication
            * `REJECTED` - Rejected
        public_url:
          type: string
          nullable: true
          readOnly: true
        uploaded_by_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - authorization_status
      - checksum_sha256
      - created_at
      - height
      - id
      - kind
      - mime_type
      - original_filename
      - public_url
      - size
      - updated_at
      - uploaded_by_email
      - width
    MediaAssetUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
        alt_text:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 500
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: PRIVATE
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          default: STAFF_UPLOAD
        source_note:
          type: string
          maxLength: 255
      required:
      - file
    MfaMethodEnum:
      enum:
      - totp
      - recovery
      - webauthn
      type: string
      description: |-
        * `totp` - TOTP
        * `recovery` - Recovery code
        * `webauthn` - WebAuthn
    MfaStatus:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MfaMethodEnum'
        totp_enabled:
          type: boolean
        webauthn_credentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredential'
        recovery_codes_remaining:
          type: integer
      required:
      - methods
      - recovery_codes_remaining
      - totp_enabled
      - webauthn_credentials
    MfaVerify:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MfaMethodEnum'
        code:
          type: string
          writeOnly: true
          maxLength: 32
        credential:
          writeOnly: true
      required:
      - method
    MobileAuthFlow:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AuthFlowStatusEnum'
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MfaMethodEnum'
        challenge:
          type: string
          description: Short-lived, single-use MFA challenge.
      required:
      - challenge
      - methods
      - status
    MobileChallenge:
      type: object
      properties:
        challenge:
          type: string
          writeOnly: true
          maxLength: 2048
      required:
      - challenge
    MobileCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 4096
      required:
      - email
      - password
    MobileLogout:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    MobileMfaMethodEnum:
      enum:
      - totp
      - recovery
      type: string
      description: |-
        * `totp` - TOTP
        * `recovery` - Recovery code
    MobileMfaVerify:
      type: object
      properties:
        challenge:
          type: string
          writeOnly: true
          maxLength: 2048
        method:
          $ref: '#/components/schemas/MobileMfaMethodEnum'
        code:
          type: string
          writeOnly: true
          maxLength: 32
      required:
      - challenge
      - code
      - method
    MobileRefresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MobileTokenResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
          description: 'Only after first MFA enrollment: show once, never stored by
            the app.'
      required:
      - access
      - refresh
    MobileTotpConfirm:
      type: object
      properties:
        challenge:
          type: string
          writeOnly: true
          maxLength: 2048
        code:
          type: string
          writeOnly: true
          maxLength: 32
      required:
      - challenge
      - code
    NavigationItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
        label:
          type: string
          maxLength: 80
        page:
          type: integer
          nullable: true
        url:
          type: string
          default: ''
          maxLength: 500
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        visible:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - label
      - updated_at
    NavigationMenu:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          description: e.g. header, footer
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/NavigationItem'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - items
      - key
      - title
      - updated_at
    OriginEnum:
      enum:
      - STAFF_UPLOAD
      - CLIENT_PROVIDED
      - THIRD_PARTY
      type: string
      description: |-
        * `STAFF_UPLOAD` - Uploaded by staff
        * `CLIENT_PROVIDED` - Provided by the client
        * `THIRD_PARTY` - Third party / licensed
    Page:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/PageStatusEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        seo_title:
          type: string
          maxLength: 70
        seo_description:
          type: string
          maxLength: 300
        og_image:
          type: integer
          nullable: true
        canonical_url:
          type: string
          maxLength: 500
        noindex:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - published_at
      - slug
      - title
      - updated_at
    PageSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        variant:
          type: string
          maxLength: 40
        position:
          type: integer
          readOnly: true
        enabled:
          type: boolean
        schema_version:
          type: integer
          minimum: 1
          description: Defaults to the latest version of the type.
        content:
          description: Section content; shape defined by the (type, schema_version)
            schema.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - position
      - type
      - updated_at
      - variant
    PageStatusEnum:
      enum:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PUBLISHED` - Published
        * `ARCHIVED` - Archived
    PaginatedMediaAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    PaginatedNavigationMenuList:
      type: object
      required:
      - count
      - results
      properties:
        count:
