packages:
  - apps/web
  - apps/mobile
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7

# Accepted advisories (review on every Expo SDK upgrade; remove as soon as a fix ships).
# GHSA-86w9-cpqp-85rv: node-forge <=1.4.0 (no patched release) reached only through the
# Expo CLI (@expo/cli, @expo/code-signing-certificates) used at build/dev time; it is not
# bundled into the app or executed by the API. Accepted 2026-10-02 (WR-12).
# GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 (no patched release) reached only through Metro
# (metro-file-map > micromatch), the build-time bundler matching developer-controlled globs;
# not shipped in the app bundle or used by the API. Accepted 2026-10-03 (WR-12).
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
