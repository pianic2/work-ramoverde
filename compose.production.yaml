name: ${COMPOSE_PROJECT_NAME:-ramoverde-production}

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: production
      args:
        UV_EXTRA_ARGS: ${UV_EXTRA_ARGS:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed PostgreSQL connection string}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique production DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set explicit production hostnames}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?Set explicit HTTPS CORS origins}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set explicit HTTPS CSRF origins}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          host=os.environ["DJANGO_ALLOWED_HOSTS"].split(",")[0];
          request=urllib.request.Request("http://127.0.0.1:8000/api/v1/health/live",
          headers={"Host":host,"X-Forwarded-Proto":"https"});
          urllib.request.urlopen(request,timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the public HTTPS VITE_API_BASE_URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
